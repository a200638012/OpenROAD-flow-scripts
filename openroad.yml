name: openroad
channels:
  - conda-forge
dependencies:
  # —— Python ——
  - python=3.11
  # —— 构建工具链(必须用 conda 编译器,与 conda C++ 库 ABI 一致)——
  - cmake>=3.31            # 实际装到 4.4.2(注意:cmake 4 对 <3.5 项目需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5)
  - c-compiler             # 拉入 gcc_linux-64(sysroot_linux-64)
  - cxx-compiler           # 拉入 gxx_linux-64(gcc 14),默认链接 conda 的 libstdc++(6.0.35)
  - ninja
  - ccache
  - swig>=4.3
  - bison>=3.8
  - flex>=2.6
  - pkg-config             # 激活钩子自动设 PKG_CONFIG_PATH,让 or-tools 找到 Clp/Cbc
  # —— C++ 库(OpenROAD 直接依赖)——
  - libboost-devel>=1.85   # 共享 Boost;编译时须传 -DUSE_SYSTEM_BOOST=ON
  - fmt                    # spdlog 外部 fmt(SPDLOG_FMT_EXTERNAL=ON)
  - spdlog>=1.15
  - gtest>=1.14
  - eigen=3.4
  - yaml-cpp>=0.8
  - zlib
  # —— OR-Tools 及其 COIN-OR 依赖(走 pkg-config)——
  - libortools>=9.10       # 9.15;依赖 absl/re2/protobuf 等自动解析
  # —— kepler-formal(naja)需要 ——
  - capnproto
  # —— openroad GUI 支持(可选;不装则 openroad 编译为无 GUI 版)——
  - qt-main               # Qt5 5.15,自带 Qt5Charts;装后需清掉 build/CMakeCache.txt 才会被重新检测
  # 注:GUI 编译还需 OpenGL 头。conda sysroot 没有 GL/gl.h,需软链系统的:
  #   ln -sf /usr/include/GL $CONDA_PREFIX/include/GL
  # 注:以下两库 conda-forge 无可用/兼容版本,需从源码编译进本环境:
  #   * CUDD 3.0.0       (github.com/The-OpenROAD-Project/cudd)         —— OpenSTA 需要
  #   * lemon(OpenROAD fork, C++20 已修)(github.com/The-OpenROAD-Project/lemon-graph) —— gpl/cts/dpl 需要
  #     (conda vanilla lemon 1.3.1 用了 C++20 已移除的 allocator::construct/destroy)
  # 注:tcl 用系统的 /usr/lib64/libtcl.so (8.6)
